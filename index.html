<title>תחזית שקיעה</title><style>
:root{--bg1:#3a1f2b;--bg2:#1c1420;--accent:#F2A65A;--sub:rgba(255,255,255,.78)}
*{box-sizing:border-box}@media (hover:hover) and (pointer:fine){html{scrollbar-gutter:stable}}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Hebrew','Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#fff;min-height:100vh;background:linear-gradient(var(--bg1),var(--bg2) 900px) var(--bg2);font-weight:400}
p{margin:0}button{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;position:relative}
.hero{position:relative;height:75vh;min-height:560px;max-height:820px;overflow:hidden;background:var(--bg1)}
.hero img,.hero canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .3s ease}
.hero img.out,.hero canvas.out{opacity:0}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(58,31,43,0) 30%,rgba(28,15,22,.62) 58%,rgba(32,17,26,.85) 82%,var(--bg1) 100%)}
.top{position:absolute;top:16px;right:16px;left:16px;z-index:3;display:flex;justify-content:space-between;align-items:flex-start}
.pill{background:rgba(0,0,0,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;min-height:40px;display:flex;align-items:center;gap:8px;color:#fff;cursor:pointer}
.hc{position:absolute;bottom:56px;right:24px;left:24px;z-index:2;transition:opacity .3s ease,transform .3s ease}
.hc.out{opacity:0;transform:translateY(8px)}
.label{font-size:14px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 8px rgba(0,0,0,.35);margin-bottom:8px;min-height:20px}
.hc::before{content:"";position:absolute;z-index:-1;pointer-events:none;right:-48px;left:-24px;top:-48px;height:240px;background:radial-gradient(ellipse 65% 60% at 80% 35%,rgba(0,0,0,.5),rgba(0,0,0,.22) 50%,transparent 75%)}
.hero.grad .hc{bottom:24px}
.score{direction:ltr;text-align:right;font-size:96px;font-weight:700;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin:0}
.score small{font-size:32px;font-weight:400;opacity:.78;letter-spacing:0}
.sent{font-size:17px;font-weight:600;line-height:1.4;margin-top:16px;min-height:48px}
.time{font-size:14px;color:var(--sub);margin-top:8px;font-variant-numeric:tabular-nums}
#conf{font-size:12px;font-weight:600;color:var(--sub);margin-top:8px;cursor:pointer}#conf:empty{display:none}
.credit{position:absolute;bottom:8px;left:8px;right:8px;z-index:2;font-size:12px;color:rgba(255,255,255,.7);line-height:1.4;text-align:left}
.credit div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.credit a{color:inherit}
#rng{position:relative;width:min(220px,60%);height:4px;margin:16px 0 32px auto;border-radius:4px;background:#ffffff33}#rng:empty{display:none}
#rng i{position:absolute;top:0;bottom:0;border-radius:4px;background:#fffc;transform-origin:right;transform:scaleX(0);transition:transform .8s cubic-bezier(0,0,.58,1)}
#rng b{position:absolute;top:-4px;width:12px;height:12px;margin-right:-6px;border-radius:50%;background:#fff;box-shadow:0 0 6px #0005;opacity:0;transition:opacity .4s .8s}
#rng em{position:absolute;top:8px;font-size:12px;font-style:normal;opacity:.6;line-height:1}
#rng.go i{transform:scaleX(1)}#rng.go b{opacity:1}
section{padding:24px 16px 0;position:relative;z-index:1}
h2{font-size:14px;font-weight:600;color:var(--sub);margin:0 0 8px}
.wk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:8px;padding:4px}
.seg button{all:unset;font-size:12px;font-weight:600;padding:8px 16px;border-radius:8px;color:var(--sub);cursor:pointer;transition:background .3s,color .3s}
.seg button[aria-pressed=true]{background:rgba(255,255,255,.9);color:#2a1620}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.card{all:unset;box-sizing:border-box;flex:0 0 64px;height:96px;scroll-snap-align:start;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;cursor:pointer;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.card.sel{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.6)}
.card .d{font-size:12px;color:var(--sub)}
.card .s{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%}
.low .dot{opacity:.5}.low .s{opacity:.6}
.star{position:absolute;top:4px;left:8px;font-size:12px;color:var(--accent)}
#tip{position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);background:rgba(0,0,0,.75);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:9;white-space:nowrap}
#tip.on{opacity:1;transform:translate(-50%,0)}
.tl{position:relative;height:72px;margin:8px 32px 0}
.tl .line{position:absolute;top:16px;right:0;left:0;height:2px;background:linear-gradient(to left,#F2A65A,#E0607E,#4A5BA8);border-radius:2px}
.tl.rise .line{background:linear-gradient(to left,#4A5BA8,#E0607E,#F2A65A)}
.mk{position:absolute;top:8px;transform:translateX(50%);text-align:center;font-size:12px;white-space:nowrap}
.mk i{display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 8px;border:2px solid #fff}
.mk b{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.mk span{color:var(--sub)}
.why{background:rgba(255,255,255,.08);border-radius:16px;padding:16px;font-size:14px;line-height:1.5}
.why>p{font-size:17px;font-weight:600;line-height:1.4}
details{margin-top:8px}summary{font-size:14px;font-weight:600;color:var(--accent);cursor:pointer;min-height:44px;display:flex;align-items:center}
#why{list-style:none;padding:0;margin:0;font-size:14px;color:var(--sub)}#why li{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff22;padding:8px 0}#why li:last-child{border:0}
#rate{display:none;margin:24px 16px 0;background:rgba(255,255,255,.08);border-radius:16px;padding:16px;text-align:center}
#rq{font-size:17px;font-weight:600}#rb{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0 8px}
#rb button{font-size:17px;height:48px;border-radius:16px;border:0;background:#ffffffe6;color:#1d1d1f;font-weight:600}
#rmsg{font-size:14px;min-height:20px}#rate .exp{margin-top:8px;border-radius:8px;border:0;padding:4px 8px;font-size:12px}
footer{padding:32px 16px 40px;font-size:12px;color:var(--sub);text-align:center}
.hc.old{opacity:.5}
#note{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:rgba(0,0,0,.75);padding:8px 16px;border-radius:16px;font-size:14px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:9;max-width:calc(100% - 32px);text-align:center}#note.on{opacity:1;transform:translate(-50%,0)}
#pick{display:none;position:absolute;top:64px;right:16px;left:16px;z-index:4;flex-direction:column;align-items:stretch;gap:8px;background:rgba(20,12,18,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;padding:16px}
#cityf{display:flex;gap:8px}#cityq{flex:1;font-size:16px;padding:8px 16px;border-radius:999px;border:0;min-width:0}
#cityf button,#loc{font-size:16px;padding:8px 16px;border-radius:999px;border:0;font-weight:600;background:#fff;color:#1d1d1f}
#res{max-height:min(240px,40vh);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px}
.sug{min-height:44px;flex:none;font-size:14px;padding:8px;border-radius:12px;border:0;background:#ffffffe6;color:#1d1d1f;text-align:right}.sugsub{opacity:.6}.sugmsg{font-size:14px;opacity:.9;text-align:center}.credit a{color:inherit}
#fail{display:none;background:rgba(0,0,0,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:16px;margin-bottom:16px}#fail p{font-size:17px;font-weight:600;margin-bottom:8px}#fail .fsub{font-size:14px;font-weight:400;color:var(--sub);margin-bottom:16px}body.nodata .hc{top:72px;bottom:24px;display:flex;flex-direction:column;justify-content:center}body.nodata #fail{padding:24px 16px;text-align:center}body.nodata .hc::before{display:none}#fail button{font-size:16px;font-weight:600;padding:8px 24px;border-radius:999px;border:0;background:#fff;color:#1d1d1f;min-height:44px}
body.nodata #fail{display:block}body.nodata #score,body.nodata #rng,body.nodata #msg,body.nodata #time,body.nodata #conf,body.nodata #day,body.nodata section:not(#wk),body.nodata #rate,body.nodata-all section{display:none}
#upd{position:fixed;top:8px;left:8px;z-index:5;font-size:12px;padding:4px 8px;border-radius:999px;background:#0006;opacity:0;transition:opacity .3s;pointer-events:none}#upd.on{opacity:.85}
#bgx{position:fixed;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(transparent 40%,#b0456066,#6a309355);opacity:0;transition:opacity .6s ease}
#clouds{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cl{position:absolute;left:-50%;width:200%;opacity:0;transition:opacity .6s ease;will-change:transform;animation:drift linear infinite}
.cl.h{top:2%;height:28%;background:radial-gradient(ellipse 18% 30% at 20% 50%,#fff8,transparent 70%),radial-gradient(ellipse 22% 25% at 60% 40%,#fff6,transparent 70%),radial-gradient(ellipse 15% 20% at 85% 60%,#fff6,transparent 70%);animation-duration:90s}
.cl.m{top:30%;height:30%;background:radial-gradient(ellipse 14% 35% at 10% 50%,#fff7,transparent 70%),radial-gradient(ellipse 20% 40% at 45% 55%,#fff6,transparent 70%),radial-gradient(ellipse 16% 30% at 78% 45%,#fff7,transparent 70%);animation-duration:75s;animation-direction:reverse}
.cl.l{bottom:-4%;height:34%;background:radial-gradient(ellipse 20% 45% at 15% 60%,#dde3eb99,transparent 70%),radial-gradient(ellipse 25% 50% at 55% 65%,#cfd6df99,transparent 70%),radial-gradient(ellipse 18% 40% at 88% 55%,#dde3eb99,transparent 70%);animation-duration:60s}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(25%,0,0)}}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fx{animation:fu .6s cubic-bezier(.2,.8,.2,1) both}
body.loading .hc{opacity:.6}
@media (min-width:900px){.wrap{max-width:720px}.hero{border-radius:0 0 24px 24px}}
@media (prefers-reduced-motion:reduce){.cl{animation:none}.fx{animation:none}#bgx,.cl,#rng i,#rng b,.hc,.hero img,.hero canvas,#tip{transition:none}}
</style></head><body class="loading"><div id="upd" role="status" aria-live="polite"></div><div id="bgx"></div><div id="clouds"><div class="cl h"></div><div class="cl m"></div><div class="cl l"></div></div><div id="tip" role="status"></div><div id="note" role="status" aria-live="polite"></div>
<main class="wrap">
<header class="hero" id="sky">
 <img id="skyi" decoding="async" alt=""><canvas id="skyc" width="600" height="900" style="display:none"></canvas>
 <div class="top"><button class="pill" id="place">📍</button></div>
 <div id="pick"><form id="cityf"><input id="cityq" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="חיפוש עיר"><button>חפש</button></form><div id="res"></div><button id="loc">📍 השתמש במיקום שלי</button></div>
 <div class="hc" id="hc">

  <div class="score" id="score" dir="ltr" role="img"></div>

 </div>
 <div class="credit"><div id="pcred" dir="ltr"></div><div id="pcap"></div><div id="skycap" style="display:none">איור משוער, לא צילום</div></div>
</header>
<section aria-label="השבוע" id="wk">
 <div class="wk-head"><h2 style="margin:0">השבוע</h2><div class="seg" role="group" aria-label="סוג"><button id="t-set" aria-pressed="false">שקיעות</button><button id="t-rise" aria-pressed="false">זריחות</button></div></div>
 <div class="strip" id="strip"></div>
</section>
<section aria-label="ציר זמן"><h2 id="tlh">השעה הקרובה</h2><div class="tl" id="tl"></div></section>
<section aria-label="למה"><h2>למה?</h2><div class="why"><ul id="why"></ul></div></section>
<div id="rate"><div id="rq"></div><div id="rb"></div><div id="rmsg"></div><button class="exp" id="exp">ייצוא דיווחים</button></div>
