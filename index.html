const g=x.createLinearGradient(0,0,0,Hh);g.addColorStop(0,mix([110,120,135],[60,40,110],sat));g.addColorStop(.55,mix([150,158,168],[230,90,110],sat));g.addColorStop(1,mix([185,188,192],[255,170,80],sat));
x.fillStyle=g;x.fillRect(0,0,W,Hh);
const sx=isSet?W*.3:W*.7,hz=Hh*.82;let r=x.createRadialGradient(sx,hz,0,sx,hz,140);r.addColorStop(0,mix([230,230,230],[255,230,150],sat));r.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=r;x.fillRect(0,0,W,Hh);
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const n=Math.round(2+canvas*10);for(let i=0;i<n;i++){const y=Hh*(.12+rnd()*.5),cx=rnd()*W,len=120+rnd()*220,lit=rnd()<canvas;
x.strokeStyle=lit?mix([200,200,205],[255,120,140],sat):'rgba(90,95,110,.55)';x.lineWidth=4+rnd()*8;x.lineCap='round';x.globalAlpha=.85;x.beginPath();x.moveTo(cx-len/2,y);x.quadraticCurveTo(cx,y-10+rnd()*20,cx+len/2,y+rnd()*8);x.stroke()}
x.globalAlpha=1;if(block>.05){const bh=Hh*.06+block*Hh*.25;x.fillStyle='rgba(70,72,82,.9)';x.fillRect(0,hz-bh,W,bh+2)}
if(isSet&&SEA){x.fillStyle='#1e2638';x.fillRect(0,hz,W,Hh-hz);x.fillStyle=mix([180,180,180],[255,190,120],sat);x.globalAlpha=.5;x.fillRect(sx-60,hz+8,120,3);x.fillRect(sx-35,hz+18,70,3);x.globalAlpha=1}else{x.fillStyle='#1e1b2a';x.beginPath();x.moveTo(0,Hh);for(let i=0;i<=W;i+=20)x.lineTo(i,hz-12-10*Math.sin(i/70)-6*Math.sin(i/23));x.lineTo(W,Hh);x.fill()}

$('sky').style.display='block'}
function ens(p,t,humid,haze){if(!p.en||!p.ef||!p.en.hourly||!p.ef.hourly)return null;const sc=[],cm=[];
for(let m=0;m<=50;m++){const x=m?'_member'+String(m).padStart(2,'0'):'';const H=p.en.hourly,F=p.ef.hourly;
if(H['cloud_cover_high'+x]==null||F['cloud_cover_low'+x]==null)continue;
const hi=at(H,'cloud_cover_high'+x,t)+0.6*at(H,'cloud_cover_mid'+x,t),cv=Math.max(0,1-Math.abs(hi-50)/50),bl=at(F,'cloud_cover_low'+x,t)/100;
if([hi,bl].some(v=>v==null||isNaN(v)))continue;sc.push(Math.round(1+9*cv*(1-0.8*bl)*humid*haze));cm.push({s:sc[sc.length-1],cv,bl,mid:at(H,'cloud_cover_mid'+x,t),low:H['cloud_cover_low'+x]?at(H,'cloud_cover_low'+x,t):0,hi})}
sc.splice(0,sc.length,...sc.filter(Number.isFinite));if(sc.length<10)return null;sc.sort((a,b)=>a-b);const q=f=>sc[Math.floor(f*(sc.length-1))];const spread=q(.9)-q(.1);
return{s:Math.round(q(.5)),med:(()=>{const g=q(.5);return cm.find(o=>o.s==g)})(),good:(()=>{const g=q(.9);return cm.find(o=>o.s==g)})(),ch:Math.round(100*sc.filter(v=>v>=7).length/sc.length),conf:spread<=2?'high':spread<=4?'mid':'low'}}
function show(k){cur=k;$('t-rise').className=k=='rise'?'on':'';$('t-set').className=k=='set'?'on':'';if(!D)return;for(const[id,kk,nm]of[['t-rise','rise','זריחה'],['t-set','set','שקיעה']]){const e=D[kk]&&D[kk].f.daily[kk=='set'?'sunset':'sunrise'];if(e)$(id).textContent=nm+' · '+(e[0]*1000<Date.now()?'מחר':'היום')}
const p=D[k],ev=p.f.daily[k=='set'?'sunset':'sunrise'],day=ev[0]*1000<Date.now()?1:0,t=ev[day],H=p.f.hourly;$('day').textContent=day?'מחר':'היום';
const R0=calc(p,H,t);let {s,canvas,block,humid,haze,aod}=R0;PC=cat(R0);const EN=ens(p,t,humid,haze);if(EN)s=EN.s;window.EMED=EN&&EN.med;if(EN&&EN.med){canvas=EN.med.cv;block=EN.med.bl;if(PC!='haze')PC=gcat(EN.med)}ALT=0;try{sky(s,canvas,block,haze,k=='set')}catch(e){}
const L=s<=3?['כנראה שקיעה אפורה','#5B6B7F,#9AA5B1']:s<=6?['יכולה להיות נחמדה','#F2A65A,#7A8FB0']:s<=8?['שווה לצאת!','#FF7E5F,#B05BA8']:['שקיעה מרהיבה צפויה!','#FF5E62,#FF9966,#6A3093'];
document.body.classList.remove('loading');$('score').innerHTML=s+'<small>/10</small>';$('score').classList.remove('c-high','c-mid','c-low');$('score').className='score'+(EN?' c-'+EN.conf:'');$('conf').textContent=EN?{high:'ודאות גבוהה',mid:'ודאות בינונית',low:'ודאות נמוכה'}[EN.conf]+(EN.ch>=10&&EN.s<7?' · סיכוי של '+EN.ch+'% למחזה מרהיב ▸':''):'';GOOD=EN&&EN.ch>=10&&EN.s<7&&EN.good?{...EN.good,haze,set:k=='set'}:null;BASE=[s,canvas,block,haze,k=='set'];$('skycap').textContent='איור משוער, לא צילום';try{photo(PC,0,k=='set',s)}catch(e){console.error('photo failed',e)}if(day){const t0=ev[0],r=calc(p,H,t0);LAST={date:new Date(t0*1000).toISOString(),type:k,predicted:r.s,canvas:+r.canvas.toFixed(3),block:+r.block.toFixed(3),humid:r.humid,haze:r.haze,aod:r.aod};}else LAST=null;
$('rate').style.display=day?'block':'none';$('rq').textContent=k=='set'?'איך הייתה השקיעה היום?':'איך הייתה הזריחה היום?';$('msg').textContent=k=='rise'?L[0].replace('שקיעה','זריחה'):L[0];document.body.style.background=`linear-gradient(${L[1]})`;
const m=Math.round((t*1000-Date.now())/6e4);$('time').textContent=`${k=='set'?'שקיעה':'זריחה'} ב-${new Date((t+(D.off||0))*1000).toISOString().slice(11,16)}`+(m>0?` · בעוד ${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`:'');
$('why').innerHTML=[['☁️ עננים גבוהים שיתפסו צבע',canvas>0.6?'g':canvas>=0.3?'m':'b'],[`🌅 אופק פתוח ב${k=='set'?'מערב':'מזרח'}`,block<0.2?'g':block<=0.5?'m':'b'],['💧 לחות',humid==1?'g':'b'],['🌫️ אוויר צלול',haze==1?'g':haze==0.85?'m':'b']].map(([a,b])=>`<li>${a}: ${mark(b)}</li>`).join('')}
let LAST=null;
$('rb').innerHTML=[...Array(10)].map((_,i)=>`<button onclick="rate(${i+1})">${i+1}</button>`).join('');
function rate(n){if(!LAST)return;const log=JSON.parse(localStorage.sunsetLog||'[]');log.push({...LAST,observed:n,reported:new Date().toISOString()});localStorage.sunsetLog=JSON.stringify(log);$('rmsg').textContent=`נשמר: ${n}/10, תודה!`}
function exportLog(){const b=new Blob([localStorage.sunsetLog||'[]'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sunset-log.json';a.click()}
let PLACE='',SEQ=0,MANUAL=0;
function sunAz(lat,isSet,ms){const d=new Date(ms),n=(d-Date.UTC(d.getUTCFullYear(),0,1))/864e5,dec=23.44*Math.sin(2*Math.PI*(284+n)/365)*Math.PI/180,c=Math.sin(dec)/Math.cos(lat*Math.PI/180),A=Math.acos(Math.max(-1,Math.min(1,c)))*180/Math.PI;return isSet?360-A:A}
function sunward(lat,lon,az,km){const r=az*Math.PI/180;return [+(lat+km*Math.cos(r)/111).toFixed(4),+(lon+km*Math.sin(r)/(111*Math.cos(lat*Math.PI/180))).toFixed(4)]}
async function load(lat,lon,name){const my=++SEQ;LL=[lat,lon];SEA=lat>31.2&&lat<33.1&&lon<34.75+0.25*(lat-31.2);PLACE=name||'';if(PLACE)$('place').textContent='📍 '+PLACE+' ▾';$('time').textContent='…';
const T='&timezone=auto&timeformat=unixtime&forecast_days=2',q=`&hourly=cloud_cover_low,cloud_cover_mid,cloud_cover_high,relative_humidity_2m&daily=sunrise,sunset${T}`,ms=Date.now()+12*36e5;
const azS=sunAz(lat,1,ms),azR=sunAz(lat,0,ms),pS=sunward(lat,lon,azS,75),pR=sunward(lat,lon,azR,75);console.log('sunward',PLACE||'gps',lat,lon,'set az',azS.toFixed(1),pS.join(','),'rise az',azR.toFixed(1),pR.join(','));
const E='https://ensemble-api.open-meteo.com/v1/ensemble',eq='&models=ecmwf_ifs025'+T,ok=p=>p.catch(e=>{console.warn('optional request failed',e&&e.message);return null}),pt=p=>`latitude=${p[0]}&longitude=${p[1]}`;
let f,w,e,aq,en,enw,ene;try{[f,w,e,aq,en,enw,ene]=await Promise.all([j(`${F}?latitude=${lat}&longitude=${lon}${q}`),ok(j(`${F}?${pt(pS)}${q}`)),ok(j(`${F}?${pt(pR)}${q}`)),ok(j(`${A}?latitude=${lat}&longitude=${lon}&hourly=aerosol_optical_depth${T}`)),ok(j(`${E}?latitude=${lat}&longitude=${lon}&hourly=cloud_cover_low,cloud_cover_mid,cloud_cover_high${eq}`)),ok(j(`${E}?${pt(pS)}&hourly=cloud_cover_low${eq}`)),ok(j(`${E}?${pt(pR)}&hourly=cloud_cover_low${eq}`))])}catch(err){if(my!=SEQ)return;document.body.classList.remove('loading');$('time').textContent='';$('msg').textContent='לא הצלחנו לטעון תחזית, נסו שוב';return}
if(my!=SEQ)return;if(!f||!f.daily||f.error){document.body.classList.remove('loading');$('time').textContent='';$('msg').textContent='לא הצלחנו לטעון תחזית, נסו שוב';return}
const OFF=f.utc_offset_seconds||0;D={off:OFF,set:{f,far:w,en,ef:enw},rise:{f,far:e,en,ef:ene},aq};$('place').textContent='📍 '+(PLACE||'המיקום שלך')+' ▾';show(cur)}
function locate(){MANUAL=0;$('msg').textContent='מאתר מיקום…';document.body.classList.add('loading');
const tlv=(why)=>{if(MANUAL)return;load(32.08,34.78,'תל אביב-יפו');$('note').textContent='לא הצלחנו לאתר אותך, מציגים את תל אביב-יפו'};
if(!navigator.geolocation||!window.isSecureContext)return tlv('הדפדפן לא תומך במיקום');
navigator.geolocation.getCurrentPosition(p=>{$('note').textContent='';if(MANUAL)return;const la=p.coords.latitude,lo=p.coords.longitude;load(la,lo,'');
const setN=n=>{if(n&&!PLACE){PLACE=n;$('place').textContent='📍 '+n+' ▾'}};let c=null;try{c=JSON.parse(localStorage.geoName||'null')}catch(e){}
if(c&&Date.now()-c.t<6e5&&Math.abs(c.la-la)<0.05&&Math.abs(c.lo-lo)<0.05)setN(c.n);
else fetch(`https://nominatim.openstreetmap.org/reverse?lat=${la}&lon=${lo}&format=json&accept-language=he&zoom=10`).then(r=>r.json()).then(g=>{if(g&&g.name){localStorage.geoName=JSON.stringify({la,lo,n:g.name,t:Date.now()});setN(g.name)}}).catch(()=>{})},e=>tlv(e.code==1?'הרשאת המיקום נחסמה':'לא הצלחנו לאתר מיקום'),{timeout:10000,maximumAge:600000})}
function togglePick(v){const e=$('pick');e.style.display=(v===undefined?e.style.display=='none':v)?'flex':'none'}
const NZ=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f\u0591-\u05c7]/g,'').toLowerCase().replace(/[\s\-־'"׳״.,]+/g,' ').trim();
function good(c,q){const n=NZ(q);if(n.length<3)return false;return [c.name,c.en].some(x=>{const m=NZ(x);return m==n||(m.startsWith(n+' '))})}
const close=(c,q)=>{const n=NZ(q);return n.length>=2&&[c.name,c.en].some(x=>NZ(x).includes(n))};let SCTL=null,STMR=0,NREQ=0;
async function fetchSug(q){if(SCTL)SCTL.abort();const ctl=SCTL=new AbortController(),u=`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=`,g=l=>{NREQ++;return fetch(u+l,{signal:ctl.signal}).then(r=>r.json())};
const [r,re]=await Promise.all([g('he'),g('en').catch(e=>{if(e.name=='AbortError')throw e;return null})]);if(ctl!==SCTL||$('cityq').value.trim()!=q)return null;
const R=(r&&r.results)||[],EN={};for(const c of (re&&re.results)||[])EN[c.id]=c.name;for(const c of R)c.en=EN[c.id];RES=R.slice(0,4);LASTQ=q;render(q);return R}
function vis(){const i=$('cityq'),t=i.getBoundingClientRect().top,b=Math.max(i.getBoundingClientRect().bottom,$('res').getBoundingClientRect().bottom),vh=(window.visualViewport||{}).height||innerHeight;if(t<0||b>vh)window.scrollTo({top:scrollY+t-12,behavior:'smooth'})}
function render(q){const was=$('res').children.length;$('res').style.opacity=1;const btn=(c,i)=>`<button type="button" onpointerdown="event.preventDefault()" onclick="pickCity(RES[${i}])" style="min-height:44px;flex:none;font-size:15px;padding:10px;border-radius:12px;border:0;background:#ffffffe6;color:#1d1d1f;text-align:right"><bdi>${c.name}</bdi><span style="opacity:.6"> · ${[c.admin1,c.country].filter(Boolean).map(x=>`<bdi>${x}</bdi>`).join(', ')}</span></button>`,msg=t=>`<div style="font-size:14px;opacity:.9;text-align:center">${t}</div>`;
const anyClose=RES.some(c=>close(c,q));$('res').innerHTML=!RES.length?msg('לא מצאנו מקום בשם הזה'):anyClose?RES.map(btn).join(''):msg('לא מצאנו מקום בשם הזה')+msg('אולי התכוונת ל:')+RES.map(btn).join('');if(!was&&$('res').children.length)setTimeout(vis,50)}
function typed(){const q=$('cityq').value.trim();clearTimeout(STMR);$('note').textContent='';if(q.length<3){if(SCTL)SCTL.abort();SCTL=null;LASTQ='';$('res').style.opacity=q?.5:1;if(!q){RES=[];$('res').innerHTML=''}return}$('res').style.opacity=.5;STMR=setTimeout(()=>fetchSug(q).catch(()=>{}),300)}

let RES=[],LASTQ='';function pickCity(c){MANUAL=1;$('res').innerHTML='';$('note').textContent='';togglePick(false);document.body.classList.add('loading');load(c.latitude,c.longitude,c.name)}
